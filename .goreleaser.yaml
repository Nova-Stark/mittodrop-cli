version: 2

project_name: mittodrop

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: mittodrop
    main: ./cmd/mittodrop
    binary: mitto
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X mittodrop/internal/version.Version={{.Version}}
      - -X mittodrop/internal/version.Commit={{.Commit}}
      - -X mittodrop/internal/version.Date={{.Date}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: "Features"
      regexp: '^.*?feat(\([^\)]+\))?:'
      order: 0
    - title: "Bug Fixes"
      regexp: '^.*?fix(\([^\)]+\))?:'
      order: 1
    - title: "Performance Improvements"
      regexp: '^.*?perf(\([^\)]+\))?:'
      order: 2
    - title: "Maintenance"
      order: 999

